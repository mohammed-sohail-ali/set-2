<!DOCTYPE html>
<html>
<head>
  <title>My Resume</title>
  <link rel="stylesheet" href="styles.css">
  <script src="validate.js"></script>
</head>
<body>
  <h1>Your Name</h1>
  <p>Aspiring Software Engineer</p>

  <h2>Education</h2>
  <table border="1">
    <tr><th>Course</th><th>College</th><th>Year</th></tr>
    <tr><td>B.Tech CSE</td><td>Your College</td><td>2027</td></tr>
    <tr><td>Class XII</td><td>Your School</td><td>2023</td></tr>
  </table>

  <h2>Skills</h2>
  <ul>
    <li>HTML, CSS, JavaScript</li>
    <li>Git and GitHub</li>
  </ul>

  <h2>Projects</h2>
  <ul>
    <li>Event Registration Form (HTML, CSS, JS)</li>
    <li>To-Do App (JavaScript)</li>
  </ul>

  <h2>Contact Me</h2>
  <form onsubmit="return validateForm()">
    Name: <input type="text" id="name"><br><br>
    Email: <input type="text" id="email"><br><br>
    Message: <textarea id="message"></textarea><br><br>
    <input type="submit" value="Send">
  </form>
</body>
</html>
